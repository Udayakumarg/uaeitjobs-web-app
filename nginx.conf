server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # img-src allows any https: host because company/job logos are scraped
    # from arbitrary external sites, not just our own. script-src/style-src
    # stay locked to 'self' (+ Google Fonts for style/font) — verified no
    # other third-party script or inline-style dependency exists in the app
    # (the JSON-LD <script type="application/ld+json"> tags are inert, not
    # JS, so script-src 'self' doesn't affect them).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://uaeitjobs.com https://www.uaeitjobs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── Social-crawler bot detection ──────────────────────────────────────────
    # When a social platform (LinkedIn, Twitter/X, WhatsApp, Slack, Facebook,
    # Telegram) or a search-engine crawler fetches /jobs/{id}, redirect it to
    # the backend's SEO meta endpoint which returns a fully-rendered HTML page
    # with the correct Open Graph / Twitter Card / JSON-LD tags for that job.
    #
    # Real browser traffic falls through to try_files → index.html as normal.
    # ─────────────────────────────────────────────────────────────────────────
    location ~* ^/jobs/(\d+)$ {
        # Build a flag: 1 = bot, 0 = real browser
        set $social_bot 0;
        if ($http_user_agent ~* "(Twitterbot|LinkedInBot|facebookexternalhit|Slackbot|WhatsApp|TelegramBot|Googlebot|bingbot|DuckDuckBot|YandexBot|Baiduspider|Applebot)") {
            set $social_bot 1;
        }
        if ($social_bot = 1) {
            # 302 so the backend can serve fresh content without the CDN
            # caching a stale snapshot if we update job details.
            return 302 https://www.uaeitjobs.com/api/v1/seo/job/$1;
        }
        try_files $uri /index.html;
    }

    # ── Static routes ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
